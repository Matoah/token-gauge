<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="110" x2="884" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="ring" x1="292" y1="292" x2="732" y2="732" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="t" x1="432" y1="390" x2="592" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>

    <filter id="shadow" x="60" y="60" width="904" height="904" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角矩形主体 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <!-- 内高光 -->
  <rect x="112" y="112" width="800" height="800" rx="173" stroke="white" stroke-opacity="0.08" stroke-width="2"/>

  <!-- 环形底色 -->
  <circle cx="512" cy="512" r="220" stroke="#1F2937" stroke-width="72"/>

  <!-- 进度环：约 70% -->
  <circle cx="512" cy="512" r="220" stroke="url(#ring)" stroke-width="72" stroke-linecap="round" stroke-dasharray="967.6 414.7" transform="rotate(-90 512 512)"/>

  <!-- 中心 T -->
  <rect x="432" y="390" width="160" height="62" rx="31" fill="url(#t)"/>
  <rect x="481" y="390" width="62" height="240" rx="31" fill="url(#t)"/>
</svg>